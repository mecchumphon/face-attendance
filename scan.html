<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สแกนเข้างาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #0f0f23 0%, #0d1b2a 60%, #0a0f1e 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 50px;
      position: relative;
      overflow-x: hidden;
    }

    body::before { content: ''; position: fixed; width: 500px; height: 500px; background: #10b981; border-radius: 50%; filter: blur(120px); opacity: 0.08; bottom: -150px; right: -150px; pointer-events: none; z-index: 0; }
    .page-wrap { width: 100%; max-width: 560px; position: relative; z-index: 1; animation: fadeIn 0.5s ease; display: flex; flex-direction: column; align-items: center; }

    /* Header */
    .top-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 16px; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; color: #64748b; text-decoration: none; font-size: 0.85em; padding: 6px 12px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: all 0.25s ease; }
    .back-btn:hover { color: #e2e8f0; background: rgba(255,255,255,0.1); }
    h2 { font-size: 1.1em; font-weight: 600; color: #c7d2fe; }
    .spacer { width: 80px; }

    /* Status Area */
    .status-area { width: 100%; text-align: center; margin-bottom: 14px; }
    #main-status { font-size: 0.9em; color: #94a3b8; min-height: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    #gps-status { font-size: 0.8em; color: #475569; margin-top: 6px; min-height: 18px; }
    
    /* GPS Alert */
    .gps-alert { display: none; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: #fca5a5; border-radius: 12px; padding: 12px 16px; width: 100%; margin-bottom: 12px; font-size: 0.88em; font-weight: 600; text-align: center; }

    /* Scanner Container */
    .video-container { position: relative; width: 100%; border-radius: 20px; overflow: hidden; background: #060612; min-height: 280px; }
    video { width: 100%; height: auto; display: block; transform: scaleX(-1); opacity: 0; transition: opacity 0.5s ease; border-radius: 20px; }
    video.active { opacity: 1; }

    /* Scanner frame corners */
    .scanner-frame { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    .corner { position: absolute; width: 28px; height: 28px; border-color: #10b981; border-style: solid; opacity: 0.8; }
    .corner-tl { top: 14px; left: 14px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .corner-tr { top: 14px; right: 14px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .corner-bl { bottom: 14px; left: 14px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .corner-br { bottom: 14px; right: 14px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    /* Scan line */
    .scan-line { display: none; position: absolute; left: 8%; right: 8%; height: 2px; background: linear-gradient(90deg, transparent, #10b981, transparent); box-shadow: 0 0 8px rgba(16,185,129,0.8); z-index: 6; animation: scanMove 2s ease-in-out infinite; }
    .scan-line.active { display: block; }
    
    #overlay-status { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); color: #e2e8f0; padding: 6px 18px; border-radius: 30px; z-index: 10; white-space: nowrap; font-size: 0.84em; border: 1px solid rgba(255,255,255,0.1); }

    /* Start Button */
    #btnAction { display: none; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 50px; padding: 16px 44px; font-size: 18px; font-weight: 600; cursor: pointer; font-family: 'Sarabun', sans-serif; box-shadow: 0 4px 25px rgba(16,185,129,0.45); margin: 20px auto 0; transition: all 0.3s ease; animation: btnPulse 2s ease-in-out infinite; }
    #btnAction:hover { transform: translateY(-3px); box-shadow: 0 8px 35px rgba(16,185,129,0.6); animation: none; }
    #btnAction.scanning { background: linear-gradient(135deg, #6366f1, #4f46e5); box-shadow: 0 4px 25px rgba(99,102,241,0.45); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes btnPulse { 0%,100% { box-shadow: 0 4px 25px rgba(16,185,129,0.45); } 50% { box-shadow: 0 4px 40px rgba(16,185,129,0.7); } }
    @keyframes scanMove { 0% { top: 12%; } 50% { top: 82%; } 100% { top: 12%; } }
  </style>
</head>
<body>
<div class="page-wrap">

  <div class="top-bar">
    <a href="index.html" class="back-btn">← กลับ</a>
    <h2>📷 สแกนเข้างาน</h2>
    <div class="spacer"></div>
  </div>

  <div class="status-area">
    <div id="main-status">⏳ กำลังเริ่มระบบและเปิดกล้อง...</div>
    <div id="gps-status"></div>
  </div>

  <div id="gps-alert-box" class="gps-alert">
    ⚠️ คุณอยู่นอกพื้นที่ที่กำหนด!<br>กรุณาเข้าใกล้จุดเช็คอินแล้วรีเฟรชหน้าจอ
  </div>

  <div class="video-container">
    <div class="scanner-frame">
      <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div><div class="corner corner-br"></div>
      <div class="scan-line" id="scanLine"></div>
    </div>
    <div id="overlay-status">กำลังเปิดกล้อง...</div>
    <video id="video" autoplay muted playsinline></video>
  </div>

  <!-- ปุ่มกดสแกนใบหน้า -->
  <button id="btnAction" onclick="handleAction()">📸 กดสแกนใบหน้า</button>

</div>

<!-- Canvas สำหรับประมวลผลรูป (ซ่อนไว้) -->
<canvas id="canvas" style="display: none;"></canvas>

<script>
  // 🚨 Web App URL จากการ Deploy
  const API_URL = "https://script.google.com/macros/s/AKfycbwcP4hjqvJqyLtbXhd4ifwusSVSB_Y7TP9uYUW6_LSKCzd920_Wv8BRWzH7FmqmHZRmBQ/exec"; 

  const video          = document.getElementById('video');
  const canvas         = document.getElementById('canvas');
  const mainStatus     = document.getElementById('main-status');
  const overlayStatus  = document.getElementById('overlay-status');
  const gpsStatus      = document.getElementById('gps-status');
  const gpsAlertBox    = document.getElementById('gps-alert-box');
  const btnAction      = document.getElementById('btnAction');

  let currentLat       = null;
  let currentLng       = null;
  let currentLocName   = "";
  let isCameraActive   = false;
  let isLocationVerified = false;

  window.addEventListener('load', init);

  function init() {
    if (API_URL === "YOUR_WEB_APP_URL_HERE" || API_URL.includes("AKfycby_YOUR_URL_HERE")) {
      Swal.fire({
        icon: 'error',
        title: 'ตั้งค่า API_URL ไม่ถูกต้อง',
        text: 'กรุณาใส่ Web App URL ของคุณในไฟล์ scan.html'
      });
      showError('กรุณาตั้งค่า API_URL ให้ถูกต้อง');
      return;
    }

    // 🚀 รันการเปิดกล้อง และ การตรวจสอบ GPS/Config ไปพร้อมกันแบบขนาน (Parallel) ทันทีที่โหลดหน้า
    startCamera();
    loadLocationAndConfig();
  }

  // 1. เปิดกล้องทันทีโดยไม่ต้องรอ GPS
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
      });
      video.srcObject = stream; 
      video.classList.add('active'); 
      
      isCameraActive = true;
      document.getElementById('scanLine').classList.add('active');
      overlayStatus.innerText = 'มองกล้องแล้วกดปุ่ม'; 
      overlayStatus.style.background = 'rgba(16,185,129,0.65)';

      checkReadyState();
    } catch (err) {
      console.error("Camera Error:", err);
      showError('เปิดกล้องไม่ได้: ' + err.message);
      overlayStatus.innerText = 'กล้องขัดข้อง';
      overlayStatus.style.background = 'rgba(239,68,68,0.65)';
    }
  }

  // 2. ดึง Config และ GPS ขนานกัน
  async function loadLocationAndConfig() {
    try {
      const pConfig = fetch(API_URL + '?action=getConfig').then(r => {
        if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
        return r.json();
      });
      const pGPS = getGPSLocation();

      const [config, pos] = await Promise.all([pConfig, pGPS]);

      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;

      verifyLocation(config);
    } catch (e) {
      console.error("Initialization Error:", e);
      if (e.message.includes('404')) {
        showError('ไม่สามารถเชื่อมต่อระบบ (Error 404). โปรดตรวจสอบ API_URL และการ Deploy.');
      } else {
        showError('ข้อผิดพลาดการเตรียมระบบ: ' + e.message);
      }
    }
  }

  function getGPSLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('Browser ไม่รองรับ GPS'));
      navigator.geolocation.getCurrentPosition(
        resolve,
        (err) => reject(new Error('หาสัญญาณ GPS ไม่พบ หรือผู้ใช้ไม่ได้กดอนุญาต')),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  }

  function verifyLocation(config) {
    let isInsideArea = false;
    let minDistance = Infinity;
    let closestName = "จุดเช็คอิน";
    let closestRadius = 0;

    if (!config.locations || config.locations.length === 0) {
      isInsideArea = true;
      gpsStatus.innerHTML = '<span style="color:#34d399">📍 GPS: ไม่จำกัดพื้นที่</span>';
    } else {
      for (let loc of config.locations) {
        const distMeters = getDistanceInMeters(currentLat, currentLng, loc.lat, loc.lng);
        let radiusMeters = loc.radius !== undefined ? loc.radius : 50;
        if (radiusMeters < 10) radiusMeters = radiusMeters * 1000;

        if (distMeters < minDistance) { 
            minDistance = distMeters; 
            closestName = loc.name || 'แผนกไม่ระบุชื่อ'; 
            closestRadius = radiusMeters; 
        }
      }

      if (closestRadius === 0 || minDistance <= closestRadius) {
        isInsideArea = true;
      }

      if (isInsideArea) {
        currentLocName = closestName;
        gpsStatus.innerHTML = `<span style="color:#34d399">📍 พื้นที่: ${closestName} (ห่าง ${Math.round(minDistance)}m)</span>`;
      } else {
        currentLocName = "";
        gpsStatus.innerHTML = `<span style="color:#f87171">📍 นอกพื้นที่: ใกล้สุด ${closestName} (${Math.round(minDistance)}m / ${closestRadius}m)</span>`;
      }
    }

    if (isInsideArea) { 
        mainStatus.innerText = '✅ ระบบพร้อมใช้งาน'; 
        mainStatus.style.color = '#34d399'; 
        isLocationVerified = true;
        checkReadyState();
    } else { 
        gpsAlertBox.style.display = 'block'; 
        mainStatus.innerText = '⛔ ไม่อนุญาตให้สแกน'; 
        overlayStatus.innerText = 'Out of Range'; 
    }
  }

  // เช็กความพร้อม หากทั้งกล้องเปิดแล้ว + อยู่ในพิกัดแล้ว ให้แสดงปุ่มกดสแกน
  function checkReadyState() {
    if (isCameraActive && isLocationVerified) {
      btnAction.style.display = 'inline-block';
      btnAction.innerHTML = '📸 กดสแกนใบหน้า';
      btnAction.classList.add('scanning');
    }
  }

  function handleAction() {
    if (isCameraActive && isLocationVerified) {
      takePictureAndSend();
    }
  }

  async function takePictureAndSend() {
    // 1. ถ่ายรูปจาก Video ลง Canvas
    const targetWidth = Math.min(video.videoWidth || 480, 480);
    const scale = targetWidth / video.videoWidth;
    const targetHeight = video.videoHeight * scale;

    canvas.width = targetWidth;
    canvas.height = targetHeight;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width, 0); 
    ctx.scale(-1, 1); // พลิกภาพกระจก
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    const imageBase64 = canvas.toDataURL('image/jpeg', 0.6);

    // 2. แสดง Popup โหลด
    Swal.fire({
      title: 'กำลังสแกน...',
      html: 'กรุณารอสักครู่ ระบบกำลังวิเคราะห์ใบหน้า',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    // 3. ส่งข้อมูลภาพไปตรวจสอบใบหน้าแบบระบุตัวตนอัตโนมัติ
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'scanFacePP',
          type: 'attendance', 
          imageBase64: imageBase64,
          lat: currentLat,
          lng: currentLng,
          locationName: currentLocName
        })
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const result = await response.json();

      if (result.success) {
        Swal.fire({
          icon: 'success',
          title: 'เข้างานสำเร็จ!',
          html: `<b>คุณ ${result.name}</b><br>รหัส: ${result.studentId}<br>${result.message}`,
          confirmButtonColor: '#10b981'
        }).then(() => {
          window.location.href = 'index.html';
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'สแกนไม่ผ่าน',
          text: result.error,
          confirmButtonColor: '#ef4444'
        });
      }

    } catch (error) {
      console.error("Scanning Error:", error);
      Swal.fire('ผิดพลาด', 'การเชื่อมต่อหรือประมวลผลล้มเหลว: ' + error.message, 'error');
    }
  }

  function showError(msg) { mainStatus.innerHTML = '<span style="color:#f87171">❌ ' + msg + '</span>'; }
  
  function getDistanceInMeters(lat1, lon1, lat2, lon2) { 
    const R = 6371e3; 
    const dLat = deg2rad(lat2 - lat1); 
    const dLon = deg2rad(lon2 - lon1); 
    const a = Math.sin(dLat/2) ** 2 + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) ** 2; 
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); 
  }
  function deg2rad(deg) { return deg * Math.PI / 180; }
</script>
</body>
</html>
