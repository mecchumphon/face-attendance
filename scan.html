<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สแกนเข้างาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api-config.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #0f0f23 0%, #111827 60%, #0a0f1e 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 10px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      animation: fadeIn 0.4s ease;
      flex: 1;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.88em;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.25s ease;
    }
    .back-btn:hover { color: #f8fafc; background: rgba(255,255,255,0.12); }

    h2 { font-size: 1.2em; font-weight: 700; color: #10b981; }

    /* Camera Card */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(16,185,129,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 2px solid rgba(16,185,129,0.4);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* สะท้อนภาพเหมือนกระจก */
    }

    .face-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55%;
      height: 70%;
      border: 2px dashed rgba(16, 185, 129, 0.7);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
    }

    /* Status Badges */
    .status-badge {
      font-size: 0.82em;
      padding: 8px 14px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      width: 100%;
    }

    /* Input & Button */
    .input-group {
      width: 100%;
    }

    .input-group label {
      display: block;
      font-size: 0.85em;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .std-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #f8fafc;
      font-family: 'Sarabun', sans-serif;
      font-size: 1em;
      outline: none;
      text-align: center;
    }
    .std-input:focus { border-color: #10b981; }

    .btn-scan {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-family: 'Sarabun', sans-serif;
      font-size: 1em;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16,185,129,0.4);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-scan:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16,185,129,0.5); }
    .btn-scan:disabled { background: #475569; cursor: not-allowed; box-shadow: none; opacity: 0.6; }

    canvas { display: none; }

    /* Footer */
    .app-footer {
      width: 100%;
      max-width: 480px;
      padding: 16px 0 6px;
      margin-top: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      color: #94a3b8;
      font-size: 0.8rem;
    }
    .developer-credit span { color: #38bdf8; font-weight: 600; }
    .version-badge { background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 2px 6px; border-radius: 10px; font-weight: 600; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← กลับหน้าหลัก</a>
    <h2>📷 สแกนเข้างานปกติ</h2>
    <div style="width: 70px;"></div>
  </div>

  <div class="card">
    <div class="video-container">
      <video id="webcam" autoplay playsinline muted></video>
      <div class="face-overlay"></div>
    </div>

    <div id="gpsStatus" class="status-badge" style="color: #facc15;">
      ⏳ กำลังค้นหาพิกัด GPS แม่นยำสูง...
    </div>

    <div class="input-group">
      <label for="studentId">รหัสพนักงาน / นักศึกษาแพทย์</label>
      <input type="text" id="studentId" class="std-input" placeholder="กรอกรหัสผู้ใช้งาน" autocomplete="off">
    </div>

    <button id="btnScan" class="btn-scan" onclick="processCheckIn()">
      📷 ถ่ายภาพ & บันทึกเข้างาน
    </button>
  </div>
</div>

<canvas id="photoCanvas"></canvas>

<footer class="app-footer">
  <p class="developer-credit">Developed with ❤️ by <span>MEC Chumphon Admin</span></p>
  <p class="system-version" style="margin-top: 4px; color: #64748b;">
    System Version <span class="version-badge">v2.1.0</span> | © 2026 All Rights Reserved
  </p>
</footer>

<script>
  const API_URL = localStorage.getItem('gasApiUrl') || "https://script.google.com/macros/s/AKfycbwcP4hjqvJqyLtbXhd4ifwusSVSB_Y7TP9uYUW6_LSKCzd920_Wv8BRWzH7FmqmHZRmBQ/exec";

  let userLocation = null;
  let isGpsReady = false;

  // 🚀 โหลดกล้องและดึง GPS พร้อมกันทันทีแบบขนาน
  window.addEventListener('DOMContentLoaded', () => {
    startCameraQuickly();
    getHighAccuracyGPS();
  });

  // 1. ฟังก์ชันเปิดกล้องทันที
  async function startCameraQuickly() {
    const video = document.getElementById('webcam');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    } catch (err) {
      console.error("Camera Error:", err);
      Swal.fire('กล้องขัดข้อง', 'ไม่สามารถเข้าถึงกล้องได้ กรุณ้อนุญาตสิทธิ์ใช้งานกล้องในเบราว์เซอร์', 'error');
    }
  }

  // 2. ฟังก์ชันดึง GPS แม่นยำสูงในเบื้องหลัง
  function getHighAccuracyGPS() {
    const gpsEl = document.getElementById('gpsStatus');
    
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = Math.round(position.coords.accuracy);

          userLocation = { lat, lng, accuracy };
          isGpsReady = true;

          gpsEl.innerText = `✅ GPS พร้อมใช้งาน (ความแม่นยำ ±${accuracy} ม.)`;
          gpsEl.style.color = "#34d399";
        },
        (error) => {
          console.error("GPS Error:", error);
          isGpsReady = false;
          gpsEl.innerText = "❌ ไม่สามารถระบุพิกัด GPS ได้ (กรุณาเปิด GPS/Location)";
          gpsEl.style.color = "#f87171";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    } else {
      gpsEl.innerText = "❌ อุปกรณ์นี้ไม่รองรับ GPS";
      gpsEl.style.color = "#f87171";
    }
  }

  // 3. ฟังก์ชันถ่ายภาพและส่งข้อมูลบันทึกเข้างาน
  async function processCheckIn() {
    const studentId = document.getElementById('studentId').value.trim();

    if (!studentId) {
      Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสพนักงาน/นักศึกษาแพทย์ก่อนทำการสแกน', 'warning');
      return;
    }

    if (!isGpsReady || !userLocation) {
      Swal.fire({
        icon: 'warning',
        title: 'กำลังค้นหาพิกัด GPS',
        text: 'ระบบกำลังดึงพิกัดแม่นยำสูง กรุณารอสักครู่แล้วลองกดใหม่อีกครั้ง...',
        confirmButtonColor: '#10b981'
      });
      return;
    }

    const btn = document.getElementById('btnScan');
    btn.disabled = true;
    btn.innerHTML = '⏳ กำลังบันทึกข้อมูล...';

    // ดึงภาพจากกล้องใส่ Canvas
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('photoCanvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    
    // พลิกรูปกลับด้านให้เหมือนภาพจริง
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const base64Image = canvas.toDataURL('image/jpeg', 0.85);

    const payload = {
      action: 'checkIn',
      type: 'เข้างานปกติ',
      studentId: studentId,
      lat: userLocation.lat,
      lng: userLocation.lng,
      accuracy: userLocation.accuracy,
      image: base64Image
    };

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.success) {
        Swal.fire({
          icon: 'success',
          title: 'บันทึกเข้างานสำเร็จ!',
          text: `เวลา: ${result.time || 'เรียบร้อย'}`,
          confirmButtonColor: '#10b981'
        }).then(() => {
          window.location.href = 'index.html';
        });
      } else {
        throw new Error(result.error || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล');
      }
    } catch (err) {
      console.error(err);
      Swal.fire('บันทึกไม่สำเร็จ', err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '📷 ถ่ายภาพ & บันทึกเข้างาน';
    }
  }
</script>
</body>
</html>
