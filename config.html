<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าระบบ - ระบบบันทึกเวลาปฏิบัติงานนักศึกษาแพทย์</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEC Attendance">
    
    <script src="js/api-config.js?v=2.1.0"></script>
    
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #eff6ff 100%);
            color: #1e293b; 
        }
        .bg-glow {
            position: fixed; 
            width: 60vw; 
            height: 60vw;
            background: radial-gradient(circle, rgba(14,165,233,0.08) 0%, rgba(248,250,252,0) 70%);
            top: -10%; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 0;
            pointer-events: none;
        }
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="relative min-h-full flex flex-col items-center justify-center p-4">
    <div class="bg-glow"></div>
    <div class="w-full max-w-xl mx-auto flex flex-col items-center z-10 relative">
        <div class="glass-card w-full p-6 rounded-2xl shadow-xl bg-white">
            <div class="flex items-center justify-between mb-5">
                <div>
                    <h2 class="text-base font-semibold text-slate-800">⚙️ ตั้งค่าระบบโรงพยาบาล</h2>
                    <p class="text-xs text-slate-500">จัดการ API URL, พิกัด GPS และจุดเช็คอิน</p>
                </div>
                <a href="index.html" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-600 transition-colors">ย้อนกลับ</a>
            </div>

            <div class="space-y-4 text-xs">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Google Apps Script Web App URL (/exec)</label>
                    <input type="text" id="set-api-url" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-800 font-mono text-[11px] focus:outline-none focus:border-sky-500">
                </div>

                <div class="border-t border-slate-200 pt-3">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-semibold text-slate-700 text-xs">📍 จุดเช็คอิน GPS (รองรับหลายจุด)</span>
                        <button onclick="addConfigLocation()" class="bg-sky-50 hover:bg-sky-100 text-sky-700 px-2.5 py-1 rounded-lg border border-sky-200 font-medium text-[11px]">➕ เพิ่มจุด</button>
                    </div>
                    <div id="config-locations-list" class="space-y-2.5 max-h-[300px] overflow-y-auto pr-1"></div>
                </div>

                <div class="pt-2">
                    <button type="button" onclick="saveAdminSettings()" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-white font-medium py-3 rounded-xl shadow-md transition-all cursor-pointer text-sm flex items-center justify-center gap-2">
                        <span>💾</span> บันทึกการตั้งค่าทั้งหมด
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbwcP4hjqvJqyLtbXhd4ifwusSVSB_Y7TP9uYUW6_LSKCzd920_Wv8BRWzH7FmqmHZRmBQ/exec";
        const API_URL = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : DEFAULT_URL); 
        
        let systemConfig = { locations: [] };
        let currentLat = 10.4932;
        let currentLng = 99.1801;
        
        window.addEventListener('load', async () => {
            checkAdminAuth();
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        currentLat = pos.coords.latitude;
                        currentLng = pos.coords.longitude;
                    },
                    err => console.warn("GPS Position error:", err),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        });
        
        function checkAdminAuth() {
            Swal.fire({
                title: '🔒 Admin Authentication',
                input: 'password',
                inputPlaceholder: 'กรอกรหัสผ่านแอดมิน...',
                inputAttributes: { autocapitalize: 'off' },
                showCancelButton: true,
                confirmButtonText: 'เข้าสู่ระบบ',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#0f172a',
                allowOutsideClick: false
            }).then(result => {
                if (result.isConfirmed) {
                    if (result.value === 'MECCP1234') {
                        loadConfigData();
                    } else {
                        Swal.fire('รหัสผ่านไม่ถูกต้อง', 'กรุณาลองใหม่อีกครั้ง', 'error').then(() => {
                            window.location.href = 'index.html';
                        });
                    }
                } else {
                    window.location.href = 'index.html';
                }
            });
        }
        
        async function loadConfigData() {
            document.getElementById('set-api-url').value = API_URL;
            try {
                const res = await fetch(API_URL + '?action=getConfig');
                const data = await res.json();
                if (data && data.locations) {
                    systemConfig = data;
                }
            } catch (e) {
                console.warn("Config fetch offline fallback:", e);
            }
            renderConfigLocationsUI();
        }

        function renderConfigLocationsUI() {
            const listContainer = document.getElementById('config-locations-list');
            listContainer.innerHTML = '';

            systemConfig.locations.forEach((loc, idx) => {
                const item = document.createElement('div');
                item.className = "p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2";
                item.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-slate-700 text-xs">จุดที่ #${idx + 1}</span>
                        <button onclick="removeConfigLocation(${idx})" class="text-rose-500 hover:text-rose-700 text-xs">❌ ลบจุดนี้</button>
                    </div>
                    <input type="text" value="${loc.name || ''}" onchange="systemConfig.locations[${idx}].name=this.value" placeholder="ชื่อสถานที่ / วอร์ด" class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs">
                    <div class="grid grid-cols-3 gap-1.5">
                        <input type="number" step="any" value="${loc.lat || ''}" onchange="systemConfig.locations[${idx}].lat=parseFloat(this.value)" placeholder="Latitude" class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-[11px]">
                        <input type="number" step="any" value="${loc.lng || ''}" onchange="systemConfig.locations[${idx}].lng=parseFloat(this.value)" placeholder="Longitude" class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-[11px]">
                        <input type="number" value="${loc.radius || 500}" onchange="systemConfig.locations[${idx}].radius=parseInt(this.value)" placeholder="รัศมี (ม.)" class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-[11px]">
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function addConfigLocation() {
            if (!systemConfig.locations) systemConfig.locations = [];
            systemConfig.locations.push({ name: 'จุดเช็คอินใหม่', lat: currentLat, lng: currentLng, radius: 500 });
            renderConfigLocationsUI();
        }

        function removeConfigLocation(idx) {
            systemConfig.locations.splice(idx, 1);
            renderConfigLocationsUI();
        }

        async function saveAdminSettings() {
            const newUrl = document.getElementById('set-api-url').value.trim();
            if (!newUrl) {
                Swal.fire('แจ้งเตือน', 'กรุณากรอก Web App URL', 'warning');
                return;
            }

            localStorage.setItem('gasApiUrl', newUrl);

            Swal.fire({ title: 'กำลังบันทึกการตั้งค่า...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(newUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'saveConfig', locations: systemConfig.locations })
                });
                const data = await res.json();

                if (data.success || data.message) {
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกสำเร็จ!',
                        text: 'อัปเดตค่าตั้งค่าระบบเรียบร้อยแล้ว',
                        confirmButtonColor: '#10b981'
                    }).then(() => {
                        window.location.href = 'index.html';
                    });
                } else {
                    throw new Error(data.error || 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์');
                }
            } catch (err) {
                Swal.fire('บันทึกในเครื่องสำเร็จ', 'แต่การซิงค์ไปยัง Google Apps Script มีปัญหา: ' + err.message, 'warning');
            }
        }
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registered!', reg))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
</body>
</html>
