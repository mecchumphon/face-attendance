<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการเข้างาน - ระบบบันทึกเวลาปฏิบัติงานนักศึกษาแพทย์</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="js/api-config.js?v=2.1.0"></script>
    
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #eff6ff 100%);
            color: #1e293b; 
        }
        .bg-glow {
            position: fixed; 
            width: 60vw; 
            height: 60vw;
            background: radial-gradient(circle, rgba(14,165,233,0.08) 0%, rgba(248,250,252,0) 70%);
            top: -10%; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 0;
            pointer-events: none;
        }
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="relative min-h-full flex flex-col items-center justify-center p-4">
    <div class="bg-glow"></div>
    <div class="w-full max-w-4xl mx-auto flex flex-col items-center z-10 relative">
        <div class="glass-card w-full p-4 sm:p-6 rounded-2xl shadow-xl bg-white flex flex-col h-[85vh]">
            
            <div class="flex items-center justify-between mb-5 shrink-0">
                <a href="index.html" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-slate-600 transition-colors flex items-center gap-1.5">
                    <span class="text-lg leading-none">←</span> กลับ
                </a>
                <h2 class="text-base sm:text-lg font-semibold text-slate-800 flex items-center gap-2">📋 ประวัติการเข้างาน</h2>
                <div class="w-[70px]"></div> <!-- Spacer -->
            </div>

            <!-- Stats summary -->
            <div class="grid grid-cols-3 gap-3 sm:gap-4 mb-5 text-center shrink-0">
                <div class="p-3 sm:p-4 bg-emerald-50/50 rounded-xl border border-emerald-100 shadow-sm">
                    <div id="stat-normal" class="text-2xl sm:text-3xl font-bold text-emerald-600">0</div>
                    <div class="text-[10px] sm:text-xs text-emerald-700 mt-1 font-medium">เข้างานปกติ</div>
                </div>
                <div class="p-3 sm:p-4 bg-amber-50/50 rounded-xl border border-amber-100 shadow-sm">
                    <div id="stat-shift" class="text-2xl sm:text-3xl font-bold text-amber-500">0</div>
                    <div class="text-[10px] sm:text-xs text-amber-700 mt-1 font-medium">เข้าเวร</div>
                </div>
                <div class="p-3 sm:p-4 bg-indigo-50/50 rounded-xl border border-indigo-100 shadow-sm">
                    <div id="stat-total" class="text-2xl sm:text-3xl font-bold text-indigo-600">0</div>
                    <div class="text-[10px] sm:text-xs text-indigo-700 mt-1 font-medium">รวมทั้งหมด</div>
                </div>
            </div>

            <!-- Filters & Controls -->
            <div class="bg-slate-50 p-3.5 sm:p-4 rounded-xl border border-slate-200 mb-5 shrink-0 flex flex-col gap-3.5 shadow-sm">
                <!-- Row 1: Search -->
                <div class="relative w-full">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
                    <input type="text" id="hist-search" oninput="filterHistoryLogs()" placeholder="ค้นหา รหัสพนักงาน, ชื่อ หรือ สถานที่..." class="w-full bg-white border border-slate-200 rounded-lg pl-9 pr-3 py-2 sm:py-2.5 text-xs sm:text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>
                
                <!-- Row 2: Filters -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-lg px-3 py-1.5">
                        <label class="text-[11px] text-slate-500 whitespace-nowrap font-medium">เริ่ม:</label>
                        <input type="date" id="hist-start-date" onchange="filterHistoryLogs()" class="w-full text-[11px] sm:text-xs outline-none bg-transparent text-slate-700">
                    </div>
                    <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-lg px-3 py-1.5">
                        <label class="text-[11px] text-slate-500 whitespace-nowrap font-medium">ถึง:</label>
                        <input type="date" id="hist-end-date" onchange="filterHistoryLogs()" class="w-full text-[11px] sm:text-xs outline-none bg-transparent text-slate-700">
                    </div>
                    <select id="hist-type" onchange="filterHistoryLogs()" class="bg-white border border-slate-200 rounded-lg px-2 py-2 text-[11px] sm:text-xs text-slate-700 focus:outline-none focus:border-indigo-500 font-medium">
                        <option value="">-- ประเภททั้งหมด --</option>
                        <option value="เข้างานปกติ">เข้างานปกติ</option>
                        <option value="เข้าเวร">เข้าเวร</option>
                    </select>
                </div>

                <!-- Row 3: Result info -->
                <div class="flex justify-between items-center px-1 pt-1">
                    <span id="hist-record-count" class="text-[11px] text-slate-500 font-medium">แสดง 0 จากทั้งหมด 0 รายการ</span>
                    <button onclick="resetHistoryFilters()" class="text-[11px] text-indigo-500 hover:text-indigo-700 underline">ล้างตัวกรอง</button>
                </div>

                <!-- Row 4: Buttons -->
                <div class="grid grid-cols-2 gap-3 mt-1">
                    <button onclick="fetchHistoryLogs()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2.5 rounded-lg border border-indigo-200 flex items-center justify-center gap-2 cursor-pointer transition-colors text-xs font-semibold shadow-sm">
                        <span class="text-base leading-none">🔄</span> โหลดข้อมูลใหม่
                    </button>
                    <button onclick="exportExcelLogs()" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg border border-emerald-600 flex items-center justify-center gap-2 cursor-pointer transition-colors text-xs font-semibold shadow-sm">
                        <span class="text-base leading-none">📊</span> ดาวน์โหลด Excel
                    </button>
                </div>
            </div>

            <!-- Table Container (Scrollable) -->
            <div class="flex-1 overflow-hidden border border-slate-200 rounded-xl bg-white shadow-inner flex flex-col relative">
                <div class="overflow-y-auto overflow-x-auto flex-1 custom-scrollbar">
                    <table class="w-full text-left border-collapse min-w-[650px]">
                        <thead class="sticky top-0 bg-slate-100 z-10 shadow-sm border-b border-slate-200">
                            <tr class="text-[11px] text-slate-600 font-bold uppercase tracking-wider">
                                <th class="p-3.5 whitespace-nowrap">วัน-เวลา</th>
                                <th class="p-3.5">รหัส</th>
                                <th class="p-3.5">ชื่อ-นามสกุล</th>
                                <th class="p-3.5 text-center">ประเภท</th>
                                <th class="p-3.5">สถานที่ / จุดสแกน</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body" class="text-[12px] sm:text-xs divide-y divide-slate-100 text-slate-700">
                            <tr><td colspan="5" class="text-center py-10 text-slate-400">⏳ กำลังโหลดข้อมูลประวัติ...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
    
    <script>
        const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbwcP4hjqvJqyLtbXhd4ifwusSVSB_Y7TP9uYUW6_LSKCzd920_Wv8BRWzH7FmqmHZRmBQ/exec";
        const API_URL = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : DEFAULT_URL); 
        
        let globalHistoryLogs = [];
        
        window.addEventListener('load', fetchHistoryLogs);

        async function fetchHistoryLogs() {
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-slate-400">⏳ กำลังโหลดข้อมูลประวัติ...</td></tr>`;

            try {
                const res = await fetch(API_URL + '?action=getLogs');
                const data = await res.json();

                if (data.success && data.logs) {
                    globalHistoryLogs = data.logs;
                    updateHistoryStats(globalHistoryLogs);
                    renderHistoryTable();
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-rose-400">ไม่พบข้อมูลประวัติในระบบ</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-rose-400">ไม่สามารถเชื่อมต่อดึงประวัติได้</td></tr>`;
            }
        }

        function updateHistoryStats(logs) {
            let normal = 0, shift = 0;
            logs.forEach(l => {
                if (l.type === 'เข้าเวร') shift++;
                else normal++;
            });
            document.getElementById('stat-normal').innerText = normal;
            document.getElementById('stat-shift').innerText = shift;
            document.getElementById('stat-total').innerText = logs.length;
        }

        function parseLogDate(ts) {
            if (!ts) return null;
            const parts = ts.split(' ');
            const datePart = parts[0]; 
            if (datePart.includes('-')) {
                return datePart; 
            } else if (datePart.includes('/')) {
                const [d, m, y] = datePart.split('/');
                return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            return null;
        }

        function filterHistoryLogs() {
            renderHistoryTable();
        }

        function resetHistoryFilters() {
            document.getElementById('hist-search').value = '';
            document.getElementById('hist-start-date').value = '';
            document.getElementById('hist-end-date').value = '';
            document.getElementById('hist-type').value = '';
            filterHistoryLogs();
        }

        function renderHistoryTable() {
            const tbody = document.getElementById('history-table-body');
            const query = document.getElementById('hist-search').value.toLowerCase().trim();
            const startDate = document.getElementById('hist-start-date').value;
            const endDate = document.getElementById('hist-end-date').value;
            const typeFilter = document.getElementById('hist-type').value;

            const filtered = globalHistoryLogs.filter(item => {
                const matchText = !query || 
                    String(item.studentId).toLowerCase().includes(query) ||
                    String(item.name).toLowerCase().includes(query) ||
                    String(item.location).toLowerCase().includes(query) ||
                    String(item.timestamp).toLowerCase().includes(query);

                const matchType = !typeFilter || item.type === typeFilter || (typeFilter === 'เข้างานปกติ' && item.type !== 'เข้าเวร');

                let matchDate = true;
                if (item.timestamp) {
                    const logDateStr = parseLogDate(item.timestamp);
                    if (logDateStr) {
                        if (startDate && logDateStr < startDate) matchDate = false;
                        if (endDate && logDateStr > endDate) matchDate = false;
                    }
                }

                return matchText && matchType && matchDate;
            });

            document.getElementById('hist-record-count').innerText = `แสดง ${filtered.length} จากทั้งหมด ${globalHistoryLogs.length} รายการ`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-slate-400">📭 ไม่พบประวัติที่ตรงกับเงื่อนไขการค้นหา</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            filtered.forEach(item => {
                const isShift = item.type === 'เข้าเวร';
                const badgeClass = isShift ? 'bg-amber-100 text-amber-700 border-amber-200' : 'bg-emerald-100 text-emerald-700 border-emerald-200';
                const typeText = isShift ? 'เข้าเวร' : 'เข้างานปกติ';
                
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50/80 transition-colors";
                row.innerHTML = `
                    <td class="p-3.5 whitespace-nowrap text-slate-500 font-mono text-[11px]">${item.timestamp}</td>
                    <td class="p-3.5 font-semibold text-slate-700">${item.studentId}</td>
                    <td class="p-3.5 font-medium text-slate-800">${item.name}</td>
                    <td class="p-3.5 text-center">
                        <span class="inline-block px-3 py-1 rounded-full text-[10px] font-bold border ${badgeClass}">${typeText}</span>
                    </td>
                    <td class="p-3.5 text-slate-500 truncate max-w-[180px]" title="${item.location || 'สำนักงาน'}">${item.location || 'สำนักงาน'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function exportExcelLogs() {
            if (!globalHistoryLogs || globalHistoryLogs.length === 0) {
                Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลสำหรับ Export', 'warning');
                return;
            }

            const excelData = globalHistoryLogs.map((i, idx) => ({
                'ลำดับ': idx + 1,
                'วัน-เวลา': i.timestamp,
                'รหัสนักศึกษา': i.studentId,
                'ชื่อ-นามสกุล': i.name,
                'ประเภท': i.type,
                'สถานที่': i.location
            }));

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "AttendanceLogs");
            XLSX.writeFile(wb, `Attendance_MEC_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
