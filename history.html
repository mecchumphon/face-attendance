<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการเข้างาน - ระบบบันทึกเวลาปฏิบัติงานนักศึกษาแพทย์</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="js/api-config.js?v=2.1.0"></script>
    
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #eff6ff 100%);
            color: #1e293b; 
        }
        .bg-glow {
            position: fixed; 
            width: 60vw; 
            height: 60vw;
            background: radial-gradient(circle, rgba(14,165,233,0.08) 0%, rgba(248,250,252,0) 70%);
            top: -10%; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 0;
            pointer-events: none;
        }
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="relative min-h-full flex flex-col items-center justify-center p-4">
    <div class="bg-glow"></div>
    <div class="w-full max-w-4xl mx-auto flex flex-col items-center z-10 relative">
        <div class="glass-card w-full p-4 sm:p-6 rounded-2xl shadow-xl bg-white flex flex-col h-[90vh]">
            
            <!-- Header -->
            <div class="flex items-center justify-between mb-4 shrink-0">
                <a href="index.html" class="text-sm sm:text-base bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl text-slate-700 transition-colors flex items-center gap-1.5 font-bold">
                    <span class="text-lg leading-none">←</span> กลับเมนูหลัก
                </a>
                <h2 class="text-lg sm:text-2xl font-bold text-slate-800 flex items-center gap-2">📋 ประวัติการเข้างาน</h2>
                <div class="w-[95px]"></div> <!-- Spacer -->
            </div>

            <!-- Stats summary -->
            <div class="grid grid-cols-3 gap-3 sm:gap-4 mb-4 text-center shrink-0">
                <div class="p-3.5 sm:p-5 bg-emerald-50/70 rounded-2xl border border-emerald-200 shadow-sm">
                    <div id="stat-normal" class="text-3xl sm:text-4xl font-extrabold text-emerald-600 tracking-tight">0</div>
                    <div class="text-xs sm:text-sm text-emerald-800 mt-1 font-bold">เข้างานปกติ</div>
                </div>
                <div class="p-3.5 sm:p-5 bg-amber-50/70 rounded-2xl border border-amber-200 shadow-sm">
                    <div id="stat-shift" class="text-3xl sm:text-4xl font-extrabold text-amber-600 tracking-tight">0</div>
                    <div class="text-xs sm:text-sm text-amber-800 mt-1 font-bold">เข้าเวร</div>
                </div>
                <div class="p-3.5 sm:p-5 bg-indigo-50/70 rounded-2xl border border-indigo-200 shadow-sm">
                    <div id="stat-total" class="text-3xl sm:text-4xl font-extrabold text-indigo-600 tracking-tight">0</div>
                    <div class="text-xs sm:text-sm text-indigo-800 mt-1 font-bold">รวมทั้งหมด</div>
                </div>
            </div>

            <!-- Filters & Controls -->
            <div class="bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200 mb-4 shrink-0 flex flex-col gap-3.5 shadow-sm">
                <!-- Row 1: Search -->
                <div class="relative w-full">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg">🔍</span>
                    <input type="text" id="hist-search" oninput="filterHistoryLogs()" placeholder="ค้นหา รหัสพนักงาน, ชื่อ หรือ สถานที่..." class="w-full bg-white border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm sm:text-base font-semibold text-slate-800 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>
                
                <!-- Row 2: Filters -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 py-2.5">
                        <label class="text-xs sm:text-sm text-slate-500 whitespace-nowrap font-bold">เริ่ม:</label>
                        <input type="date" id="hist-start-date" onchange="filterHistoryLogs()" class="w-full text-xs sm:text-sm outline-none bg-transparent text-slate-800 font-bold">
                    </div>
                    <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 py-2.5">
                        <label class="text-xs sm:text-sm text-slate-500 whitespace-nowrap font-bold">ถึง:</label>
                        <input type="date" id="hist-end-date" onchange="filterHistoryLogs()" class="w-full text-xs sm:text-sm outline-none bg-transparent text-slate-800 font-bold">
                    </div>
                    <select id="hist-type" onchange="filterHistoryLogs()" class="bg-white border border-slate-200 rounded-xl px-3 py-3 text-xs sm:text-sm text-slate-800 focus:outline-none focus:border-indigo-500 font-bold">
                        <option value="">-- ประเภททั้งหมด --</option>
                        <option value="เข้างานปกติ">เข้างานปกติ</option>
                        <option value="เข้าเวร">เข้าเวร</option>
                    </select>
                </div>

                <!-- Row 3: Result info -->
                <div class="flex justify-between items-center px-1">
                    <span id="hist-record-count" class="text-xs sm:text-sm text-slate-700 font-bold">แสดง 0 จากทั้งหมด 0 รายการ</span>
                    <button onclick="resetHistoryFilters()" class="text-xs sm:text-sm text-indigo-600 hover:text-indigo-800 font-bold underline">ล้างตัวกรอง</button>
                </div>

                <!-- Row 4: Buttons -->
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="fetchHistoryLogs()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-3 rounded-xl border border-indigo-200 flex items-center justify-center gap-2 cursor-pointer transition-colors text-sm sm:text-base font-bold shadow-sm">
                        <span class="text-lg leading-none">🔄</span> โหลดข้อมูลใหม่
                    </button>
                    <button onclick="exportExcelLogs()" class="bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl border border-emerald-600 flex items-center justify-center gap-2 cursor-pointer transition-colors text-sm sm:text-base font-bold shadow-sm">
                        <span class="text-lg leading-none">📊</span> ดาวน์โหลด Excel
                    </button>
                </div>
            </div>

            <!-- Table Container (Scrollable) -->
            <div class="flex-1 overflow-hidden border border-slate-200 rounded-2xl bg-white shadow-inner flex flex-col relative">
                <div class="overflow-y-auto overflow-x-auto flex-1 custom-scrollbar">
                    <table class="w-full text-left border-collapse min-w-[700px]">
                        <thead class="sticky top-0 bg-slate-100 z-10 shadow-sm border-b border-slate-200">
                            <tr class="text-xs sm:text-sm text-slate-700 font-bold uppercase tracking-wider">
                                <th class="p-4 whitespace-nowrap">วัน-เวลา</th>
                                <th class="p-4">รหัส</th>
                                <th class="p-4">ชื่อ-นามสกุล</th>
                                <th class="p-4 text-center">ประเภท</th>
                                <th class="p-4">สถานที่ / จุดสแกน</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body" class="text-sm sm:text-base divide-y divide-slate-100 text-slate-800">
                            <tr><td colspan="5" class="text-center py-10 text-slate-400 font-medium">⏳ กำลังโหลดข้อมูลประวัติ...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination Controls Bar -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mt-4 pt-3 border-t border-slate-200 shrink-0 text-xs sm:text-sm">
                <div class="flex items-center gap-2 text-slate-700 font-bold">
                    <span>แสดง</span>
                    <select id="items-per-page" onchange="changeItemsPerPage()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 font-extrabold focus:outline-none focus:border-indigo-500">
                        <option value="10">10</option>
                        <option value="20" selected>20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    <span>รายการต่อหน้า</span>
                </div>

                <div class="flex items-center gap-1.5 font-bold">
                    <button id="btn-first" onclick="goToPage(1)" class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition-colors font-bold">หน้าแรก</button>
                    <button id="btn-prev" onclick="prevPage()" class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition-colors font-bold">‹ ก่อนหน้า</button>
                    <span id="page-indicator" class="px-3.5 py-2 text-slate-800 font-extrabold">หน้า 1 จาก 1</span>
                    <button id="btn-next" onclick="nextPage()" class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition-colors font-bold">ถัดไป ›</button>
                    <button id="btn-last" onclick="goToPage('last')" class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition-colors font-bold">หน้าสุดท้าย</button>
                </div>
            </div>

        </div>
    </div>
    
    <script>
        const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbwcP4hjqvJqyLtbXhd4ifwusSVSB_Y7TP9uYUW6_LSKCzd920_Wv8BRWzH7FmqmHZRmBQ/exec";
        const API_URL = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : DEFAULT_URL); 
        
        let globalHistoryLogs = [];
        let filteredLogs = [];
        let currentPage = 1;
        let itemsPerPage = 20;
        
        window.addEventListener('load', fetchHistoryLogs);

        async function fetchHistoryLogs() {
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-slate-400 font-semibold text-base">⏳ กำลังโหลดข้อมูลประวัติ...</td></tr>`;

            try {
                const res = await fetch(API_URL + '?action=getLogs');
                const data = await res.json();

                if (data.success && data.logs) {
                    globalHistoryLogs = data.logs;
                    updateHistoryStats(globalHistoryLogs);
                    filterHistoryLogs();
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-rose-500 font-semibold text-base">ไม่พบข้อมูลประวัติในระบบ</td></tr>`;
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-rose-500 font-semibold text-base">ไม่สามารถเชื่อมต่อดึงประวัติได้</td></tr>`;
            }
        }

        function updateHistoryStats(logs) {
            let normal = 0, shift = 0;
            logs.forEach(l => {
                if (l.type === 'เข้าเวร') shift++;
                else normal++;
            });
            document.getElementById('stat-normal').innerText = normal;
            document.getElementById('stat-shift').innerText = shift;
            document.getElementById('stat-total').innerText = logs.length;
        }

        function parseLogDate(ts) {
            if (!ts) return null;
            const parts = ts.split(' ');
            const datePart = parts[0]; 
            if (datePart.includes('-')) {
                return datePart; 
            } else if (datePart.includes('/')) {
                const [d, m, y] = datePart.split('/');
                return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            return null;
        }

        function filterHistoryLogs() {
            const query = document.getElementById('hist-search').value.toLowerCase().trim();
            const startDate = document.getElementById('hist-start-date').value;
            const endDate = document.getElementById('hist-end-date').value;
            const typeFilter = document.getElementById('hist-type').value;

            filteredLogs = globalHistoryLogs.filter(item => {
                const matchText = !query || 
                    String(item.studentId).toLowerCase().includes(query) ||
                    String(item.name).toLowerCase().includes(query) ||
                    String(item.location).toLowerCase().includes(query) ||
                    String(item.timestamp).toLowerCase().includes(query);

                const matchType = !typeFilter || item.type === typeFilter || (typeFilter === 'เข้างานปกติ' && item.type !== 'เข้าเวร');

                let matchDate = true;
                if (item.timestamp) {
                    const logDateStr = parseLogDate(item.timestamp);
                    if (logDateStr) {
                        if (startDate && logDateStr < startDate) matchDate = false;
                        if (endDate && logDateStr > endDate) matchDate = false;
                    }
                }

                return matchText && matchType && matchDate;
            });

            currentPage = 1; 
            renderHistoryTable();
        }

        function resetHistoryFilters() {
            document.getElementById('hist-search').value = '';
            document.getElementById('hist-start-date').value = '';
            document.getElementById('hist-end-date').value = '';
            document.getElementById('hist-type').value = '';
            filterHistoryLogs();
        }

        function renderHistoryTable() {
            const tbody = document.getElementById('history-table-body');
            document.getElementById('hist-record-count').innerText = `แสดง ${filteredLogs.length} จากทั้งหมด ${globalHistoryLogs.length} รายการ`;

            if (filteredLogs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-slate-400 font-semibold text-base">📭 ไม่พบประวัติที่ตรงกับเงื่อนไขการค้นหา</td></tr>`;
                updatePaginationUI(0);
                return;
            }

            const totalPages = Math.ceil(filteredLogs.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + parseInt(itemsPerPage);
            const pageData = filteredLogs.slice(startIndex, endIndex);

            tbody.innerHTML = '';
            pageData.forEach(item => {
                const isShift = item.type === 'เข้าเวร';
                const badgeClass = isShift ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-emerald-100 text-emerald-800 border-emerald-300';
                const typeText = isShift ? 'เข้าเวร' : 'เข้างานปกติ';
                
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50/80 transition-colors";
                row.innerHTML = `
                    <td class="p-4 whitespace-nowrap text-slate-900 font-mono font-extrabold text-sm sm:text-base">${item.timestamp}</td>
                    <td class="p-4 font-extrabold text-slate-900 text-sm sm:text-base">${item.studentId}</td>
                    <td class="p-4 font-bold text-slate-900 text-sm sm:text-base">${item.name}</td>
                    <td class="p-4 text-center">
                        <span class="inline-block px-3 py-1 rounded-full text-xs sm:text-sm font-extrabold border ${badgeClass}">${typeText}</span>
                    </td>
                    <td class="p-4 text-slate-800 font-semibold truncate max-w-[220px]" title="${item.location || 'สำนักงาน'}">${item.location || 'สำนักงาน'}</td>
                `;
                tbody.appendChild(row);
            });

            updatePaginationUI(filteredLogs.length);
        }

        function updatePaginationUI(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            document.getElementById('page-indicator').innerText = `หน้า ${currentPage} จาก ${totalPages}`;

            document.getElementById('btn-first').disabled = (currentPage === 1);
            document.getElementById('btn-prev').disabled = (currentPage === 1);
            document.getElementById('btn-next').disabled = (currentPage === totalPages || totalItems === 0);
            document.getElementById('btn-last').disabled = (currentPage === totalPages || totalItems === 0);
        }

        function changeItemsPerPage() {
            itemsPerPage = parseInt(document.getElementById('items-per-page').value);
            currentPage = 1;
            renderHistoryTable();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderHistoryTable();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredLogs.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderHistoryTable();
            }
        }

        function goToPage(target) {
            const totalPages = Math.ceil(filteredLogs.length / itemsPerPage) || 1;
            if (target === 'last') {
                currentPage = totalPages;
            } else {
                currentPage = target;
            }
            renderHistoryTable();
        }

        function exportExcelLogs() {
            if (!globalHistoryLogs || globalHistoryLogs.length === 0) {
                Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลสำหรับ Export', 'warning');
                return;
            }

            const excelData = globalHistoryLogs.map((i, idx) => ({
                'ลำดับ': idx + 1,
                'วัน-เวลา': i.timestamp,
                'รหัสนักศึกษา': i.studentId,
                'ชื่อ-นามสกุล': i.name,
                'ประเภท': i.type,
                'สถานที่': i.location
            }));

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "AttendanceLogs");
            XLSX.writeFile(wb, `Attendance_MEC_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
