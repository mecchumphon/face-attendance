<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการเข้างาน / เข้าเวร</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- SheetJS สำหรับ Export เป็นไฟล์ Excel (.xlsx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #0f0f23 0%, #111827 60%, #0a0f1e 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      animation: fadeIn 0.4s ease;
      flex: 1;
    }

    /* Top Navigation */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.88em;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.25s ease;
    }
    .back-btn:hover { color: #f8fafc; background: rgba(255,255,255,0.12); }

    h2 { font-size: 1.25em; font-weight: 700; color: #cbd5e1; }

    /* Summary Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .stat-number {
      font-size: 1.8em;
      font-weight: 700;
      margin-top: 4px;
    }

    .stat-label { font-size: 0.8em; color: #94a3b8; }
    .stat-normal { color: #34d399; }
    .stat-shift { color: #facc15; }
    .stat-total { color: #818cf8; }

    /* Search & Tools Control */
    .controls-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 600px) {
      .filter-grid { grid-template-columns: 1fr; }
    }

    .search-input, .filter-select, .date-input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #f8fafc;
      font-family: 'Sarabun', sans-serif;
      font-size: 0.9em;
      outline: none;
    }
    .search-input:focus, .filter-select:focus, .date-input:focus { border-color: #6366f1; }

    .date-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .date-group label {
      font-size: 0.82em;
      color: #94a3b8;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-family: 'Sarabun', sans-serif;
      font-size: 0.9em;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .btn-detail { background: rgba(99,102,241,0.2); color: #c7d2fe; border: 1px solid rgba(99,102,241,0.4); }
    .btn-detail:hover { background: rgba(99,102,241,0.35); }

    .btn-excel { background: rgba(16,185,129,0.2); color: #a7f3d0; border: 1px solid rgba(16,185,129,0.4); }
    .btn-excel:hover { background: rgba(16,185,129,0.35); }

    .result-info {
      font-size: 0.82em;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    /* Alert Message Box */
    .status-alert {
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.9em;
      margin-bottom: 20px;
      display: none;
    }
    .status-alert.error {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }

    /* Logs Table */
    .table-container {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88em;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    th {
      background: rgba(255,255,255,0.05);
      color: #94a3b8;
      font-weight: 600;
      white-space: nowrap;
    }

    tr:hover { background: rgba(255,255,255,0.02); }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.82em;
      font-weight: 600;
    }
    .badge-normal { background: rgba(16,185,129,0.2); color: #34d399; }
    .badge-shift { background: rgba(234,179,8,0.2); color: #facc15; }

    /* Footer Styling */
    .app-footer {
      width: 100%;
      max-width: 850px;
      padding: 20px 0 10px;
      margin-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      color: #94a3b8;
      font-size: 0.82rem;
    }

    .footer-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .developer-credit span {
      color: #38bdf8;
      font-weight: 600;
    }

    .system-version {
      font-size: 0.78rem;
      color: #64748b;
    }

    .version-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.75rem;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="container">
  
  <div class="top-bar">
    <a href="index.html" class="back-btn">← กลับ</a>
    <h2>📋 ประวัติการเข้างาน</h2>
    <div style="width: 70px;"></div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div id="cnt-normal" class="stat-number stat-normal">0</div>
      <div class="stat-label">เข้างานปกติ</div>
    </div>
    <div class="stat-card">
      <div id="cnt-shift" class="stat-number stat-shift">0</div>
      <div class="stat-label">เข้าเวร</div>
    </div>
    <div class="stat-card">
      <div id="cnt-total" class="stat-number stat-total">0</div>
      <div class="stat-label">รวมทั้งหมด</div>
    </div>
  </div>

  <div class="controls-card">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหา รหัสพนักงาน, ชื่อ หรือ สถานที่..." oninput="filterLogs()">
    
    <div class="filter-grid">
      <div class="date-group">
        <label>เริ่ม:</label>
        <input type="date" id="startDate" class="date-input" onchange="filterLogs()">
        <label>ถึง:</label>
        <input type="date" id="endDate" class="date-input" onchange="filterLogs()">
      </div>
      <select id="typeFilter" class="filter-select" onchange="filterLogs()">
        <option value="">-- ประเภททั้งหมด --</option>
        <option value="เข้างานปกติ">เข้างานปกติ</option>
        <option value="เข้าเวร">เข้าเวร</option>
      </select>
    </div>

    <div class="result-info">
      <span id="recordCount">แสดง 0 รายการ</span>
      <a href="javascript:void(0)" onclick="resetFilters()" style="color:#818cf8; text-decoration:none;">ล้างตัวกรอง</a>
    </div>

    <div class="btn-group">
      <button class="btn btn-detail" onclick="loadLogs()">🔄 โหลดข้อมูลใหม่</button>
      <button class="btn btn-excel" onclick="exportExcel()">📊 ดาวน์โหลด Excel</button>
    </div>
  </div>

  <div id="alertBox" class="status-alert"></div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>วัน-เวลา</th>
          <th>รหัส</th>
          <th>ชื่อ-นามสกุล</th>
          <th>ประเภท</th>
          <th>สถานที่ / จุดสแกน</th>
        </tr>
      </thead>
      <tbody id="logsTableBody">
        <tr>
          <td colspan="5" style="text-align: center; color: #64748b; padding: 24px;">⏳ กำลังโหลดข้อมูล...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Footer -->
<footer class="app-footer">
  <div class="footer-container">
    <p class="developer-credit">Developed with ❤️ by <span>MEC Chumphon Admin</span></p>
    <p class="system-version">System Version <span class="version-badge">v2.1.0</span> | © 2026 All Rights Reserved</p>
  </div>
</footer>

<script>
  // 🚨 Web App URL
  const API_URL = "https://script.google.com/macros/s/AKfycbwcP4hjqvJqyLtbXhd4ifwusSVSB_Y7TP9uYUW6_LSKCzd920_Wv8BRWzH7FmqmHZRmBQ/exec"; 

  let allLogsData = [];

  window.addEventListener('load', loadLogs);

  async function loadLogs() {
    const alertBox = document.getElementById('alertBox');
    const tableBody = document.getElementById('logsTableBody');
    alertBox.style.display = 'none';

    if (API_URL === "YOUR_WEB_APP_URL_HERE" || API_URL.includes("YOUR_URL_HERE")) {
      showError('กรุณาตั้งค่า API_URL ในไฟล์ history.html เป็น Web App URL ของคุณก่อนใช้งาน');
      tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#f87171; padding:20px;">⚠️ ไม่ได้ตั้งค่า API_URL</td></tr>';
      return;
    }

    tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 24px;">⏳ กำลังดึงข้อมูลประวัติ...</td></tr>';

    try {
      const response = await fetch(API_URL + '?action=getLogs');
      const responseText = await response.text();

      if (responseText.trim().startsWith('<')) {
        throw new Error('ได้รับข้อมูลเป็น HTML แทนที่จะเป็น JSON โปรดตรวจสอบการ Deploy ว่าตั้งค่า Who has access เป็น Anyone หรือยัง');
      }

      const result = JSON.parse(responseText);

      if (result.success) {
        allLogsData = result.logs || [];
        updateStats(allLogsData);
        filterLogs(); // เรียกฟิลเตอร์เพื่อแสดงผลเริ่มต้น
      } else {
        showError('ไม่สามารถดึงข้อมูลได้: ' + (result.error || 'เกิดข้อผิดพลาดไม่ทราบสาเหตุ'));
      }

    } catch (e) {
      console.error("Fetch Error:", e);
      showError('ไม่สามารถดึงข้อมูลได้: ' + e.message);
      tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#f87171; padding:20px;">❌ เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
      
      Swal.fire({
        icon: 'error',
        title: 'ดึงข้อมูลไม่สำเร็จ',
        html: `<div style="text-align:left; font-size:0.88em; color:#cbd5e1;">
          <b>วิธีแก้ไขปัญหา:</b><br>
          1. ตรวจสอบว่าใน Apps Script เลือก <b>Who has access</b> เป็น <b>Anyone (ทุกคน)</b> แล้วหรือยัง<br>
          2. ตรวจสอบว่าใช้ลิงก์ที่ลงท้ายด้วย <b>/exec</b> (ไม่ใช่ /dev)<br>
          3. หากเพิ่งแก้โค้ดใน Apps Script ต้องกด <b>Deploy > New deployment</b> เสมอ
        </div>`,
        confirmButtonColor: '#ef4444'
      });
    }
  }

  function updateStats(logs) {
    let normal = 0, shift = 0;
    logs.forEach(l => {
      if (l.type === "เข้างานปกติ") normal++;
      else if (l.type === "เข้าเวร") shift++;
    });
    document.getElementById('cnt-normal').innerText = normal;
    document.getElementById('cnt-shift').innerText = shift;
    document.getElementById('cnt-total').innerText = logs.length;
  }

  function renderTable(logs) {
    const tableBody = document.getElementById('logsTableBody');
    document.getElementById('recordCount').innerText = `แสดง ${logs.length} จากทั้งหมด ${allLogsData.length} รายการ`;

    if (logs.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b; padding: 24px;">📭 ไม่พบประวัติการเข้างานที่ตรงกับเงื่อนไข</td></tr>';
      return;
    }

    let html = '';
    logs.forEach(item => {
      const isShift = item.type === 'เข้าเวร';
      const badgeClass = isShift ? 'badge-shift' : 'badge-normal';
      html += `
        <tr>
          <td>${item.timestamp || '-'}</td>
          <td style="font-weight:600; color:#c7d2fe;">${item.studentId || '-'}</td>
          <td>${item.name || '-'}</td>
          <td><span class="badge ${badgeClass}">${item.type || 'เข้างาน'}</span></td>
          <td style="color:#94a3b8;">${item.location || '-'}</td>
        </tr>
      `;
    });
    tableBody.innerHTML = html;
  }

  function filterLogs() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const selectedType = document.getElementById('typeFilter').value;

    const filtered = allLogsData.filter(item => {
      // 1. กรองข้อความค้นหา
      const matchText = !query || 
        String(item.studentId).toLowerCase().includes(query) ||
        String(item.name).toLowerCase().includes(query) ||
        String(item.timestamp).toLowerCase().includes(query) ||
        String(item.location).toLowerCase().includes(query);

      // 2. กรองประเภท
      const matchType = !selectedType || item.type === selectedType;

      // 3. กรองวันที่
      let matchDate = true;
      if (item.timestamp) {
        // ดึง YYYY-MM-DD จาก Timestamp (รองรับทั้งรูปแบบ YYYY-MM-DD และ DD/MM/YYYY)
        const logDateStr = parseLogDate(item.timestamp);
        if (logDateStr) {
          if (startDate && logDateStr < startDate) matchDate = false;
          if (endDate && logDateStr > endDate) matchDate = false;
        }
      }

      return matchText && matchType && matchDate;
    });

    renderTable(filtered);
  }

  // แปลง String วันที่ใน Log ให้อยู่ในรูปแบบ YYYY-MM-DD เพื่อเปรียบเทียบ
  function parseLogDate(ts) {
    if (!ts) return null;
    const parts = ts.split(' ');
    const datePart = parts[0]; // ดึงเฉพาะวันที่
    if (datePart.includes('-')) {
      return datePart; // YYYY-MM-DD
    } else if (datePart.includes('/')) {
      const [d, m, y] = datePart.split('/');
      return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
    }
    return null;
  }

  function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    document.getElementById('typeFilter').value = '';
    renderTable(allLogsData);
  }

  function exportExcel() {
    if (allLogsData.length === 0) {
      Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลประวัติสำหรับดาวน์โหลด', 'warning');
      return;
    }

    const excelData = allLogsData.map((item, index) => ({
      'ลำดับ': index + 1,
      'วัน-เวลา': item.timestamp,
      'รหัสพนักงาน/นักศึกษา': item.studentId,
      'ชื่อ-นามสกุล': item.name,
      'ประเภทการเช็คอิน': item.type,
      'สถานที่/จุดสแกน': item.location
    }));

    const worksheet = XLSX.utils.json_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "ประวัติการเข้างาน");

    const today = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(workbook, `Attendance_Logs_${today}.xlsx`);
  }

  function showError(msg) {
    const alertBox = document.getElementById('alertBox');
    alertBox.className = 'status-alert error';
    alertBox.innerHTML = '❌ ' + msg;
    alertBox.style.display = 'block';
  }
</script>
</body>
</html>
