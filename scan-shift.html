<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สแกนเข้าเวร - ระบบบันทึกเวลาปฏิบัติงานนักศึกษาแพทย์</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Face API JS -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    
    <script src="js/api-config.js?v=2.1.0"></script>
    
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #eff6ff 100%);
            color: #1e293b; 
        }
        .bg-glow {
            position: fixed; 
            width: 60vw; 
            height: 60vw;
            background: radial-gradient(circle, rgba(14,165,233,0.08) 0%, rgba(248,250,252,0) 70%);
            top: -10%; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 0;
            pointer-events: none;
        }
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
        }
    </style>
</head>
<body class="relative min-h-full flex flex-col items-center justify-center p-4">
    <div class="bg-glow"></div>
    <div class="w-full max-w-xl mx-auto flex flex-col items-center z-10 relative">
        <div class="glass-card w-full p-4 sm:p-6 rounded-2xl shadow-xl bg-white relative overflow-hidden">
            <div class="flex items-start justify-between mb-4 gap-3">
                <div class="flex-1">
                    <h2 id="scan-title" class="text-base sm:text-lg font-bold text-amber-600 leading-tight">🌙 สแกนใบหน้าเข้าเวรปฏิบัติงาน</h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1" id="scan-subtitle">บันทึกเข้าเวรนอกเวลา / เวรดึก</p>
                </div>
                <a href="index.html" class="shrink-0 text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-lg text-slate-600 transition-colors font-medium">ย้อนกลับ</a>
            </div>

            <!-- Camera viewport -->
            <div class="relative w-full aspect-[3/4] sm:aspect-[4/3] bg-slate-900 rounded-xl overflow-hidden border border-slate-200 flex items-center justify-center shadow-inner">
                <video id="webcam-video" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover opacity-90"></video>
                <div id="cam-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 text-slate-300">
                    <span class="text-4xl mb-2 animate-pulse">📷</span>
                    <span id="cam-loading-text" class="text-sm">กำลังโหลด AI Model...</span>
                </div>

                <!-- Face scan frame overlay -->
                <div class="absolute w-52 h-72 sm:w-60 sm:h-80 border-2 border-dashed border-amber-400/80 rounded-[3rem] pointer-events-none flex items-center justify-center">
                    <div id="ai-status-badge" class="absolute top-3 text-amber-300 text-[11px] font-mono tracking-widest uppercase bg-slate-900/80 px-3 py-1 rounded-full hidden">Ready</div>
                </div>

                <!-- Scan laser line -->
                <div id="scanner-laser" class="absolute left-0 right-0 h-0.5 bg-amber-400 shadow-[0_0_12px_#fbbf24] transition-all duration-300 hidden" style="top: 20%;"></div>

                <!-- GPS badge overlay -->
                <div class="absolute bottom-3 left-3 right-3 bg-white/95 backdrop-blur-md px-3 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm flex items-center justify-center gap-2 shadow-sm">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>
                    <span id="scan-gps-text" class="text-slate-700 font-medium truncate">GPS: กำลังตรวจสอบพิกัด...</span>
                </div>
            </div>
            
            <!-- Physician note input -->
            <div id="shift-input-wrap" class="mt-5">
                <label class="block text-sm font-medium text-slate-700 mb-1.5">ชื่อแพทย์เวร / หมายเหตุเพิ่มเติม</label>
                <input type="text" id="scan-physician-note" placeholder="เช่น เวรดึก / Ward ER" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-amber-500">
            </div>

            <!-- Action Controls -->
            <div class="mt-5">
                <button id="btn-trigger-scan" onclick="executeFaceScan()" class="hidden w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-white font-medium py-3.5 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer text-sm sm:text-base">
                    <span>✨</span> ยืนยันการสแกนตัวตน
                </button>
            </div>
        </div>
    </div>
    
    <script>
        const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbwcP4hjqvJqyLtbXhd4ifwusSVSB_Y7TP9uYUW6_LSKCzd920_Wv8BRWzH7FmqmHZRmBQ/exec";
        const API_URL = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : DEFAULT_URL); 
        
        let isModelLoaded = false;
        let activeStream = null;
        let currentLat = null;
        let currentLng = null;
        let systemConfig = { locations: [] };
        let isLocationVerified = false;
        let currentLocName = "";
        
        window.addEventListener('load', async () => {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                isModelLoaded = true;
                document.getElementById('ai-status-badge').classList.remove('hidden');
                initScanCamera();
                fetchSystemConfigAndGPS();
            } catch (e) {
                console.warn("AI Model load warning:", e);
            }
        });
        
        async function initScanCamera() {
            const video = document.getElementById('webcam-video');
            const ph = document.getElementById('cam-placeholder');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                activeStream = stream;
                video.srcObject = stream;
                ph.classList.add('hidden');
                checkReadyState();
            } catch (err) {
                ph.innerHTML = `<span class="text-2xl mb-1">⚠️</span><span class="text-xs text-amber-400">ไม่พบกล้อง กรุณาอนุญาตสิทธิ์กล้อง</span>`;
            }
        }
        
        async function fetchSystemConfigAndGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        currentLat = pos.coords.latitude;
                        currentLng = pos.coords.longitude;
                        evaluateGpsStatus();
                    },
                    err => {
                        console.warn("GPS Position error:", err);
                        document.getElementById('scan-gps-text').innerText = 'ไม่สามารถดึง GPS ได้';
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }

            try {
                const res = await fetch(API_URL + '?action=getConfig');
                const data = await res.json();
                if (data && data.locations) {
                    systemConfig = data;
                    evaluateGpsStatus(); // Re-evaluate if config loads after GPS
                }
            } catch (e) {
                console.warn("Config fetch offline fallback:", e);
            }
        }

        function evaluateGpsStatus() {
            if (currentLat === null || currentLng === null) return;
            
            let inside = false;
            let closestName = "จุดเช็คอิน";
            let minDistance = Infinity;
            let closestRadius = 0;

            if (!systemConfig.locations || systemConfig.locations.length === 0) {
                inside = true;
                document.getElementById('scan-gps-text').innerText = `GPS: ไม่จำกัดพื้นที่`;
            } else {
                systemConfig.locations.forEach(loc => {
                    const dist = calculateDistance(currentLat, currentLng, loc.lat, loc.lng);
                    let rad = loc.radius || 500;
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestName = loc.name;
                        closestRadius = rad;
                    }
                    if (dist <= rad) inside = true;
                });
                
                if (inside) {
                    currentLocName = closestName;
                    document.getElementById('scan-gps-text').innerText = `GPS: ในพื้นที่ ${closestName}`;
                } else {
                    currentLocName = "";
                    document.getElementById('scan-gps-text').innerText = `GPS: นอกพื้นที่ (${Math.round(minDistance)}ม.)`;
                    Swal.fire('อยู่นอกพื้นที่', 'คุณอยู่นอกพื้นที่ที่กำหนด กรุณาเข้าใกล้จุดเช็คอินแล้วรีเฟรชหน้าจอ', 'warning');
                }
            }
            
            isLocationVerified = inside;
            checkReadyState();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        
        function checkReadyState() {
            if (activeStream && isLocationVerified && isModelLoaded) {
                document.getElementById('btn-trigger-scan').classList.remove('hidden');
            } else {
                document.getElementById('btn-trigger-scan').classList.add('hidden');
            }
        }

        async function executeFaceScan() {
            const video = document.getElementById('webcam-video');
            const laser = document.getElementById('scanner-laser');
            laser.classList.remove('hidden');

            Swal.fire({
                title: 'กำลังสแกนใบหน้า...',
                html: 'กรุณานิ่งสักครู่ ระบบกำลังจับคู่โครงสร้างใบหน้า',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                if (!isModelLoaded) {
                    throw new Error('AI Model ยังโหลดไม่เสร็จ กรุณารอสักครู่');
                }

                const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
                laser.classList.add('hidden');

                if (!detection) {
                    Swal.fire('ไม่พบใบหน้า', 'กรุณามองตรงมาที่กล้องและจัดตำแหน่งใบหน้าให้อยู่ในกรอบ', 'warning');
                    return;
                }

                const descriptorArray = Array.from(detection.descriptor);
                const note = document.getElementById('scan-physician-note').value;

                const payload = {
                    action: 'scanFace',
                    type: 'shift',
                    descriptor: descriptorArray,
                    lat: currentLat,
                    lng: currentLng,
                    physician: note,
                    locationName: currentLocName
                };

                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();
                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'ลงเวลาสำเร็จ!',
                        html: `<b>ยินดีต้อนรับ ${result.name}</b><br>รหัส: ${result.studentId}<br>${result.message || ''}`,
                        confirmButtonColor: '#f59e0b'
                    }).then(() => {
                        window.location.href = 'index.html';
                    });
                } else {
                    Swal.fire('สแกนไม่ผ่าน', result.error || 'ใบหน้าไม่ตรงกับข้อมูลในฐานข้อมูล', 'error');
                }

            } catch (err) {
                laser.classList.add('hidden');
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ AI ได้: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
