<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียนใบหน้า</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d1b2a 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 60px;
      position: relative;
    }

    body::before {
      content: ''; position: fixed; width: 400px; height: 400px;
      background: #6366f1; border-radius: 50%; filter: blur(100px);
      opacity: 0.1; top: -100px; left: -100px; pointer-events: none; z-index: 0;
    }

    .container { width: 100%; max-width: 500px; position: relative; z-index: 1; animation: fadeIn 0.5s ease; }

    /* Header */
    .top-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 24px; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; color: #64748b; text-decoration: none; font-size: 0.88em; padding: 6px 12px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: all 0.25s ease; }
    .back-btn:hover { color: #e2e8f0; background: rgba(255,255,255,0.1); }
    h2 { font-size: 1.25em; font-weight: 700; color: #c7d2fe; }

    /* Instruction Styles */
    .instruction-box { background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 16px; padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: flex-start; gap: 16px; }
    .instruction-icon { font-size: 24px; background: rgba(99, 102, 241, 0.2); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; flex-shrink: 0; }
    .instruction-content { flex: 1; }
    .instruction-title { font-weight: 600; color: #e2e8f0; margin-bottom: 6px; font-size: 0.95em; }
    .instruction-list { list-style: none; font-size: 0.85em; color: #94a3b8; }
    .instruction-list li { margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .instruction-list li::before { content: '•'; color: #6366f1; font-weight: bold; }

    /* Card */
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); margin-bottom: 20px; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85em; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
    input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; color: #e2e8f0; font-size: 15px; font-family: 'Sarabun', sans-serif; transition: all 0.3s ease; outline: none; }
    input:focus { border-color: rgba(99,102,241,0.5); background: rgba(99,102,241,0.08); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }

    /* Video area */
    .video-wrapper { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: #060612; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; min-height: 250px; }
    video { width: 100%; height: auto; display: block; transform: scaleX(-1); opacity: 0; transition: opacity 0.5s ease;}
    video.active { opacity: 1; }
    
    .face-guide { position: absolute; top: 15%; bottom: 15%; left: 20%; right: 20%; border: 2px dashed rgba(99,102,241,0.5); border-radius: 50%; z-index: 5; pointer-events: none; }
    #overlay-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #64748b; font-size: 0.9em; z-index: 2; pointer-events: none; }

    /* Buttons */
    .btn { width: 100%; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: 'Sarabun', sans-serif; transition: all 0.3s ease; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; box-shadow: 0 4px 20px rgba(99,102,241,0.3); }
    .btn-primary:hover { box-shadow: 0 6px 25px rgba(99,102,241,0.5); transform: translateY(-2px); }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="container">
  
  <div class="top-bar">
    <a href="index.html" class="back-btn">← กลับ</a>
    <h2>👤 ลงทะเบียนใบหน้า</h2>
    <div style="width: 70px;"></div>
  </div>

  <div class="instruction-box">
    <div class="instruction-icon">💡</div>
    <div class="instruction-content">
      <div class="instruction-title">คำแนะนำการถ่ายภาพ (3 มุม)</div>
      <ul class="instruction-list">
        <li>ระบบจะทำการบันทึกใบหน้า 3 มุม: หน้าตรง -> หันขวา -> หันซ้าย</li>
        <li>มองกล้องในระยะพอดี ไม่สวมแว่นตาดำหรือแมสก์</li>
        <li>อยู่ในที่มีแสงสว่างเพียงพอ และขยับใบหน้าตามคำแนะนำ</li>
      </ul>
    </div>
  </div>

  <!-- Step Progress Indicator -->
  <div id="step-indicator" style="display: flex; justify-content: space-between; margin-bottom: 16px; background: rgba(255,255,255,0.05); padding: 10px 16px; border-radius: 12px; font-size: 0.85em; text-align: center;">
    <div id="step1" style="color: #6366f1; font-weight: bold;">1. หน้าตรง ⏳</div>
    <div id="step2" style="color: #64748b;">2. หันขวา ⭕</div>
    <div id="step3" style="color: #64748b;">3. หันซ้าย ⭕</div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="studentId">รหัสพนักงาน / รหัสนักศึกษา</label>
      <input type="text" id="studentId" placeholder="ระบุรหัสประจำตัว" autocomplete="off">
    </div>
    
    <div class="form-group">
      <label for="name">ชื่อ - นามสกุล</label>
      <input type="text" id="name" placeholder="ระบุชื่อ-นามสกุล" autocomplete="off">
    </div>

    <div class="video-wrapper">
      <div id="overlay-text">รอเปิดกล้อง...</div>
      <div class="face-guide"></div>
      <video id="video" autoplay muted playsinline></video>
    </div>

    <button id="btnAction" class="btn btn-primary" onclick="handleAction()">📷 เปิดกล้อง</button>
  </div>
</div>

<!-- Canvas สำหรับดึงภาพ -->
<canvas id="canvas" style="display: none;"></canvas>

<script>
  // 🚨 สำคัญมาก: เปลี่ยนเป็น Web App URL ของคุณที่ได้จากการ Deploy ล่าสุด (ต้องลงท้ายด้วย /exec)
  const API_URL = "https://script.google.com/macros/s/AKfycbwcP4hjqvJqyLtbXhd4ifwusSVSB_Y7TP9uYUW6_LSKCzd920_Wv8BRWzH7FmqmHZRmBQ/exec"; 

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const btnAction = document.getElementById('btnAction');
  const overlayText = document.getElementById('overlay-text');
  
  const inputId = document.getElementById('studentId');
  const inputName = document.getElementById('name');

  let isCameraActive = false;
  let currentStep = 1; // 1: หน้าตรง, 2: ข้างขวา, 3: ข้างซ้าย
  let capturedImages = [];

  function handleAction() {
    if (!isCameraActive) {
      // เปิดกล้อง
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } })
        .then(stream => { 
          video.srcObject = stream; 
          video.classList.add('active'); 
          overlayText.style.display = 'none';
          
          isCameraActive = true;
          updateStepUI();
        })
        .catch(err => { 
          Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตให้สิทธิ์', 'error');
        });
    } else {
      // ตรวจสอบข้อมูลก่อนถ่าย
      const studentId = inputId.value.trim();
      const name = inputName.value.trim();

      if (!studentId || !name) {
        Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสและชื่อให้ครบถ้วนก่อนสแกน', 'warning');
        return;
      }

      if (API_URL === "YOUR_WEB_APP_URL_HERE" || API_URL.includes("AKfycby_YOUR_URL_HERE")) {
        Swal.fire({
          icon: 'error',
          title: 'ตั้งค่า API_URL ไม่ถูกต้อง',
          text: 'กรุณาใส่ Web App URL ของคุณในไฟล์ register.html'
        });
        return;
      }

      captureStepImage(studentId, name);
    }
  }

  function updateStepUI() {
    const s1 = document.getElementById('step1');
    const s2 = document.getElementById('step2');
    const s3 = document.getElementById('step3');

    if (currentStep === 1) {
      btnAction.innerHTML = '📸 1/3 ถ่ายภาพหน้าตรง';
      s1.style.color = '#6366f1'; s1.innerHTML = '1. หน้าตรง ⏳';
      s2.style.color = '#64748b'; s2.innerHTML = '2. หันขวา ⭕';
      s3.style.color = '#64748b'; s3.innerHTML = '3. หันซ้าย ⭕';
    } else if (currentStep === 2) {
      btnAction.innerHTML = '📸 2/3 ถ่ายภาพหันขวา';
      s1.style.color = '#10b981'; s1.innerHTML = '1. หน้าตรง ✅';
      s2.style.color = '#6366f1'; s2.innerHTML = '2. หันขวา ⏳';
      s3.style.color = '#64748b'; s3.innerHTML = '3. หันซ้าย ⭕';
    } else if (currentStep === 3) {
      btnAction.innerHTML = '📸 3/3 ถ่ายภาพหันซ้าย';
      s1.style.color = '#10b981'; s1.innerHTML = '1. หน้าตรง ✅';
      s2.style.color = '#10b981'; s2.innerHTML = '2. หันขวา ✅';
      s3.style.color = '#6366f1'; s3.innerHTML = '3. หันซ้าย ⏳';
    }
  }

  function captureStepImage(studentId, name) {
    // ปรับขนาดรูปเป็นความกว้างไม่เกิน 480px เพื่อประมวลผลเร็วขึ้นมาก
    const targetWidth = Math.min(video.videoWidth || 480, 480);
    const scale = targetWidth / video.videoWidth;
    const targetHeight = video.videoHeight * scale;

    canvas.width = targetWidth;
    canvas.height = targetHeight;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width, 0); 
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // แปลงภาพเป็น base64 ที่มีขนาดเล็กลง (คุณภาพ 0.65)
    const imageBase64 = canvas.toDataURL('image/jpeg', 0.65);
    capturedImages.push(imageBase64);

    if (currentStep < 3) {
      currentStep++;
      updateStepUI();
      Swal.fire({
        icon: 'info',
        title: `มุมที่ ${currentStep - 1} สำเร็จ!`,
        text: currentStep === 2 ? 'กรุณาค่อยๆ หันหน้าไปทางขวาเล็กน้อย แล้วกดถ่าย' : 'กรุณาค่อยๆ หันหน้าไปทางซ้ายเล็กน้อย แล้วกดถ่าย',
        timer: 1800,
        showConfirmButton: false
      });
    } else {
      // ถ่ายครบ 3 มุม ส่งขึ้นเซิร์ฟเวอร์
      registerAllFaces(studentId, name);
    }
  }

  async function registerAllFaces(studentId, name) {
    Swal.fire({
      title: 'กำลังลงทะเบียน 3 มุม...',
      html: 'กำลังส่งข้อมูลประมวลผลโครงสร้างใบหน้า',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8', 
        },
        body: JSON.stringify({
          action: 'registerFacePP',
          studentId: studentId,
          name: name,
          imagesBase64: capturedImages // ส่งเป็น Array 3 ภาพ
        })
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const result = await response.json();

      if (result.success) {
        Swal.fire({
          icon: 'success',
          title: 'ลงทะเบียนสำเร็จ!',
          text: result.message,
          confirmButtonColor: '#4f46e5'
        }).then(() => {
          // เคลียร์ฟอร์มและสถานะ
          inputId.value = '';
          inputName.value = '';
          capturedImages = [];
          currentStep = 1;
          updateStepUI();
        });
      } else {
        capturedImages = [];
        currentStep = 1;
        updateStepUI();
        Swal.fire('ผิดพลาด', result.error, 'error');
      }

    } catch (error) {
      console.error("Registration Error:", error);
      capturedImages = [];
      currentStep = 1;
      updateStepUI();
      Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ' + error.message, 'error');
    }
  }
</script>
</body>
</html>
