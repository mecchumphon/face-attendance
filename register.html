<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนใบหน้า - ระบบบันทึกเวลาปฏิบัติงานนักศึกษาแพทย์</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Face API JS -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEC Attendance">
    
    <script src="js/api-config.js?v=2.1.0"></script>
    
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #eff6ff 100%);
            color: #1e293b; 
        }
        .bg-glow {
            position: fixed; 
            width: 60vw; 
            height: 60vw;
            background: radial-gradient(circle, rgba(14,165,233,0.08) 0%, rgba(248,250,252,0) 70%);
            top: -10%; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 0;
            pointer-events: none;
        }
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
        }
    </style>
</head>
<body class="relative min-h-full flex flex-col items-center justify-center p-4">
    <div class="bg-glow"></div>
    <div class="w-full max-w-xl mx-auto flex flex-col items-center z-10 relative">
        <div class="glass-card w-full p-4 sm:p-6 rounded-2xl shadow-xl bg-white">
            <div class="flex items-start justify-between mb-5 gap-3">
                <div class="flex-1">
                    <h2 class="text-base sm:text-lg font-bold text-sky-600 leading-tight">👤 ลงทะเบียนผู้ใช้งานใหม่ </h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">บันทึกข้อมูลและใบหน้า </p>
                </div>
                <a href="index.html" class="shrink-0 text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-lg text-slate-600 transition-colors font-medium">ย้อนกลับ</a>
            </div>

            <!-- Step Indicator -->
            <div class="grid grid-cols-3 gap-2 mb-5 text-center text-[11px] sm:text-xs">
                <div id="reg-step-1" class="p-2 rounded-xl bg-sky-50 text-sky-700 font-semibold border border-sky-200">1. หน้าตรง</div>
                <div id="reg-step-2" class="p-2 rounded-xl bg-slate-50 text-slate-400 border border-slate-200">2. หันขวา</div>
                <div id="reg-step-3" class="p-2 rounded-xl bg-slate-50 text-slate-400 border border-slate-200">3. หันซ้าย</div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">รหัสนักศึกษา / แพทย์</label>
                    <input type="text" id="reg-id" placeholder="เช่น 6701234567" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">ชื่อ - นามสกุล</label>
                    <input type="text" id="reg-name" placeholder="เช่น นายแพทย์ ภูมิใจ ไทยแท้" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-sky-500">
                </div>

                <!-- Camera View for Registration -->
                <div class="relative w-full aspect-[3/4] sm:aspect-[4/3] bg-slate-900 rounded-xl overflow-hidden border border-slate-200 flex items-center justify-center shadow-inner">
                    <video id="reg-video" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover opacity-90"></video>
                    <div id="reg-cam-ph" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 text-slate-300 text-sm">
                        <span class="text-3xl mb-2">⏳</span> กำลังโหลดกล้องลงทะเบียน...
                    </div>
                    <div class="absolute w-48 h-64 sm:w-56 sm:h-72 border-2 border-dashed border-sky-400 rounded-[2.5rem] pointer-events-none"></div>
                </div>

                <div class="pt-2">
                    <button type="button" id="btn-reg-capture" onclick="captureRegistrationAngle()" class="w-full bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-medium py-3.5 rounded-xl shadow-md transition-all cursor-pointer text-sm sm:text-base flex items-center justify-center gap-2">
                        <span>📸</span> ถ่ายภาพมุมที่ 1 (หน้าตรง)
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbwcP4hjqvJqyLtbXhd4ifwusSVSB_Y7TP9uYUW6_LSKCzd920_Wv8BRWzH7FmqmHZRmBQ/exec";
        const API_URL = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : DEFAULT_URL); 

        let registrationStep = 1;
        let registrationDescriptors = [];
        let isModelLoaded = false;
        let activeStream = null;

        window.addEventListener('load', async () => {
            initRegisterCamera();
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                isModelLoaded = true;
                console.log("AI Face Models Loaded Successfully");
            } catch (e) {
                console.warn("AI Model load warning:", e);
                const ph = document.getElementById('reg-cam-ph');
                if (ph) ph.innerHTML = `<span class="text-xs text-amber-400">ไม่สามารถโหลด AI Model ได้</span>`;
            }
        });
        
        async function initRegisterCamera() {
            registrationStep = 1;
            registrationDescriptors = [];
            updateRegUI();

            const video = document.getElementById('reg-video');
            const ph = document.getElementById('reg-cam-ph');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                activeStream = stream;
                video.srcObject = stream;
                ph.classList.add('hidden');
            } catch (err) {
                ph.innerHTML = `<span class="text-xs text-amber-400">ไม่สามารถเปิดกล้องได้</span>`;
            }
        }
        
        function updateRegUI() {
            for (let i = 1; i <= 3; i++) {
                const el = document.getElementById(`reg-step-${i}`);
                if (i < registrationStep) {
                    el.className = "p-2 rounded-xl bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200";
                    el.innerText = `${i}. เสร็จสิ้น ✅`;
                } else if (i === registrationStep) {
                    el.className = "p-2 rounded-xl bg-sky-50 text-sky-700 font-semibold border border-sky-200 animate-pulse";
                    el.innerText = `${i}. ${i===1?'หน้าตรง':i===2?'หันขวา':'หันซ้าย'} ⏳`;
                } else {
                    el.className = "p-2 rounded-xl bg-slate-50 text-slate-400 border border-slate-200";
                    el.innerText = `${i}. ${i===2?'หันขวา':'หันซ้าย'} ⭕`;
                }
            }
            const btn = document.getElementById('btn-reg-capture');
            if (registrationStep === 1) btn.innerHTML = '<span>📸</span> ถ่ายภาพมุมที่ 1 (หน้าตรง)';
            if (registrationStep === 2) btn.innerHTML = '<span>📸</span> ถ่ายภาพมุมที่ 2 (หันขวา)';
            if (registrationStep === 3) btn.innerHTML = '<span>📸</span> ถ่ายภาพมุมที่ 3 (หันซ้าย)';
        }

        async function captureRegistrationAngle() {
            const id = document.getElementById('reg-id').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            if (!id || !name) {
                Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสนักศึกษาและชื่อ-นามสกุลให้ครบถ้วนก่อนถ่ายภาพ', 'warning');
                return;
            }

            if (!isModelLoaded) {
                Swal.fire('รอสักครู่', 'ระบบ AI กำลังเตรียมความพร้อม...', 'info');
                return;
            }

            Swal.fire({ title: `กำลังบันทึกมุมที่ ${registrationStep}...`, allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const video = document.getElementById('reg-video');
                const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

                if (!detection) {
                    Swal.fire('ไม่พบใบหน้า', 'กรุณาปรับตำแหน่งใบหน้าให้อยู่ในกรอบ', 'warning');
                    return;
                }

                registrationDescriptors.push(Array.from(detection.descriptor));

                if (registrationStep < 3) {
                    registrationStep++;
                    updateRegUI();
                    Swal.fire({
                        icon: 'success',
                        title: `บันทึกมุมที่ ${registrationStep - 1} สำเร็จ`,
                        text: registrationStep === 2 ? 'กรุณาหันหน้าไปทางขวาเล็กน้อย' : 'กรุณาหันหน้าไปทางซ้ายเล็กน้อย',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    // Send all 3 descriptors to server
                    const payload = {
                        action: 'registerFace',
                        studentId: id,
                        name: name,
                        descriptors: registrationDescriptors
                    };

                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();

                    if (result.success) {
                        Swal.fire({
                            icon: 'success',
                            title: 'ลงทะเบียนสำเร็จ!',
                            text: result.message || 'บันทึกข้อมูลใบหน้า 3 มุมเรียบร้อยแล้ว',
                            confirmButtonColor: '#0284c7'
                        }).then(() => {
                            window.location.href = 'index.html';
                        });
                    } else {
                        throw new Error(result.error || 'บันทึกไม่สำเร็จ');
                    }
                }
            } catch (err) {
                registrationStep = 1;
                registrationDescriptors = [];
                updateRegUI();
                Swal.fire('ข้อผิดพลาด', err.message, 'error');
            }
        }
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registered!', reg))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
</body>
</html>
